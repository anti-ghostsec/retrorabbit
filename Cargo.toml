[package]
name = "retrorabbit"
version = "0.1.0"
edition = "2024"
description = "Your own little cable TV: channels that are always on, built from your media."
license = "MIT"
repository = "https://github.com/anti-ghostsec/retrorabbit"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "default_fonts"] }
raw-window-handle = "0.6"
x11rb = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = "1"
dirs = "6"
libc = "0.2"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true

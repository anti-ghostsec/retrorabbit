[package]
name = "retrorabbit"
version = "0.1.0"
edition = "2024"
description = "Your own little cable TV: channels that are always on, built from your media."
license = "MIT"
repository = "https://github.com/anti-ghostsec/retrorabbit"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = "1"
dirs = "6"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11"] }
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
libloading = "0.8"

[profile.dev]
# Debug info: file and line numbers for our code, none for dependencies,
# or the build folder grows by tens of gigabytes.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
strip = true

name: build

on:
  push:
    branches: [main, port]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      # Only for the smoke test: if the runners' Ubuntu mirror stalls, the build and
      # tests above still count and the smoke test is skipped (with a warning).
      - name: Install mpv, ffmpeg and Xvfb
        id: apt
        continue-on-error: true
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          # The runners' Ubuntu mirror sometimes stalls: give each try 5 minutes.
          for try in 1 2 3; do
            timeout 300 sudo -E apt-get install -y -q --no-install-recommends -o Acquire::Retries=5 -o Acquire::http::Timeout=30 \
              mpv ffmpeg xvfb xauth xdotool libgl1-mesa-dri libegl1 libxkbcommon-x11-0 </dev/null && break
            echo "apt try $try failed"
            [ "$try" = 3 ] && exit 1
          done
      - name: Smoke test (Xvfb, silent test media)
        if: steps.apt.outcome == 'success'
        timeout-minutes: 10
        run: ci/smoke-linux.sh target/release/retrorabbit smoke
      - name: Smoke test skipped
        if: steps.apt.outcome != 'success'
        run: echo "::warning::Ubuntu mirror stalled; Linux smoke test skipped (build and tests passed)"
      - uses: actions/upload-artifact@v4
        with:
          name: retrorabbit-linux-x86_64
          path: target/release/retrorabbit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: smoke

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Build the Vulkan loader
        # mpv.exe links vulkan-1.dll. GPU drivers install it, but PCs and VMs without
        # one don't have it, so the download ships Khronos's loader, built from source.
        shell: bash
        run: |
          git clone -q --depth 1 -b vulkan-sdk-1.4.363.0 https://github.com/KhronosGroup/Vulkan-Loader vkloader
          cmake -S vkloader -B vkloader/build -A x64 -DUPDATE_DEPS=ON -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build vkloader/build --config Release --parallel >/dev/null
          find vkloader/build -name vulkan-1.dll
      - name: Package with mpv and ffprobe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mpv_url=$(gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest \
            --jq '.assets[] | select(.name | test("^mpv-x86_64-[0-9].*\\.7z$")) | .browser_download_url' | head -1)
          echo "mpv: $mpv_url"
          curl -fsSL -o mpv.7z "$mpv_url"
          7z x -y -ompv mpv.7z >/dev/null
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
          7z x -y -offmpeg ffmpeg.zip >/dev/null
          d=dist/RetroRabbit
          mkdir -p "$d"
          cp target/release/retrorabbit.exe README.md LICENSE "$d/"
          ls mpv
          cp mpv/mpv.exe "$d/"
          # Recent mpv builds put some libraries next to mpv.exe.
          cp mpv/*.dll "$d/" 2>/dev/null || true
          cp ffmpeg/*/bin/ffprobe.exe "$d/"
          cp ffmpeg/*/LICENSE.txt "$d/ffprobe-LICENSE.txt" || true
          cp "$(find vkloader/build -name vulkan-1.dll | head -1)" "$d/"
          cp vkloader/LICENSE.txt "$d/vulkan-loader-LICENSE.txt"
          cat > "$d/THIRD-PARTY.txt" <<TXT
          mpv.exe: mpv (GPL-2.0-or-later), build from https://github.com/shinchiro/mpv-winbuild-cmake
            ($mpv_url). Source: https://github.com/mpv-player/mpv
          ffprobe.exe: FFmpeg (LGPL-2.1-or-later), build from https://github.com/BtbN/FFmpeg-Builds
            (ffmpeg-master-latest-win64-lgpl). Source: https://ffmpeg.org
          vulkan-1.dll: Khronos Vulkan Loader (Apache-2.0), built from
            https://github.com/KhronosGroup/Vulkan-Loader (vulkan-sdk-1.4.363.0).
          RetroRabbit only runs these as separate programs.
          TXT
          ci/make-test-media.sh "$PWD/testmedia" "$(ls ffmpeg/*/bin/ffmpeg.exe)"
          # The runner has no GPU, only OpenGL 1.1: test with Mesa's software OpenGL
          # in a separate copy (the download itself doesn't ship it). The MinGW build:
          # Mesa's MSVC build currently comes without OpenGL.
          mesa_url=$(gh api repos/pal1000/mesa-dist-win/releases/latest \
            --jq '.assets[] | select(.name | test("release-mingw\\.7z$")) | .browser_download_url' | head -1)
          echo "mesa: $mesa_url"
          curl -fsSL -o mesa.7z "$mesa_url"
          7z x -y -omesa mesa.7z >/dev/null
          cp -r dist/RetroRabbit smoketest
          cp mpv/mpv.com smoketest/ || true
          gl=$(find mesa -iname opengl32.dll | grep -i x64 | head -1 || true)
          if [ -z "$gl" ]; then find mesa -iname '*.dll'; echo "no x64 opengl32.dll in Mesa"; exit 1; fi
          echo "Mesa OpenGL: $gl"
          cp "$(dirname "$gl")"/*.dll smoketest/
      - name: Smoke test
        timeout-minutes: 10
        shell: pwsh
        run: ci/smoke-windows.ps1 -Dir smoketest -Media "$PWD/testmedia" -Out smoke
      - uses: actions/upload-artifact@v4
        with:
          name: retrorabbit-windows-x86_64
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: smoke

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Bundle RetroRabbit.app with libmpv and ffprobe
        run: |
          brew install --quiet mpv dylibbundler
          ci/bundle-macos.sh target/release/retrorabbit dist/RetroRabbit.app "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          ditto -c -k --keepParent dist/RetroRabbit.app dist/RetroRabbit-macos-${{ matrix.arch }}.zip
      - name: Smoke test
        timeout-minutes: 10
        run: ci/smoke-macos.sh dist/RetroRabbit.app smoke
      - uses: actions/upload-artifact@v4
        with:
          name: retrorabbit-macos-${{ matrix.arch }}
          path: dist/RetroRabbit-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-macos-${{ matrix.arch }}
          path: smoke

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/rust
      - name: Build the Rust library for each ABI
        working-directory: android/rust
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -P 28 -o ../app/src/main/jniLibs build --release
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the APK
        run: gradle -p android assembleRelease --no-daemon
      - run: mv android/app/build/outputs/apk/release/*.apk RetroRabbit-android-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: retrorabbit-android-tv
          path: RetroRabbit-android-tv.apk

  android-tv-emulator:
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: retrorabbit-android-tv
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ffmpeg </dev/null
      - name: Smoke test on an Android TV emulator (no audio)
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: ci/smoke-android.sh RetroRabbit-android-tv.apk smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-android-tv
          path: smoke

  # A v* tag publishes a GitHub release with every platform's download.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the downloads
        run: |
          set -euo pipefail
          mkdir -p out
          chmod +x artifacts/retrorabbit-linux-x86_64/retrorabbit  # artifacts drop the exec bit
          tar -C artifacts/retrorabbit-linux-x86_64 -czf out/retrorabbit-linux-x86_64.tar.gz retrorabbit
          (cd artifacts/retrorabbit-windows-x86_64 && zip -qr ../../out/RetroRabbit-windows-x86_64.zip RetroRabbit)
          cp artifacts/retrorabbit-macos-arm64/*.zip artifacts/retrorabbit-macos-x86_64/*.zip out/
          cp artifacts/retrorabbit-android-tv/RetroRabbit-android-tv.apk out/
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -l out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Your own little cable TV, now on Linux, Windows, macOS and Android TV.

          - **Windows:** unzip `RetroRabbit-windows-x86_64.zip` and run `retrorabbit.exe` (mpv, ffprobe and the Vulkan loader are included).
          - **macOS 15+:** `RetroRabbit-macos-arm64.zip` (Apple silicon) or `-x86_64.zip` (Intel). Not notarized: the first time, right-click the app and choose Open.
          - **Android TV:** install `RetroRabbit-android-tv.apk` (for example with `adb install`). Signed with a test (debug) key.
          - **Linux:** `retrorabbit-linux-x86_64.tar.gz`; needs `mpv`, `ffprobe` and an X11 session (or XWayland).

          `SHA256SUMS.txt` has the checksums. See the README for keys and remote buttons.
          NOTES
          gh release create "$TAG" out/* --title "RetroRabbit $TAG" --notes-file notes.md --verify-tag
